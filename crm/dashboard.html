<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajwa Dispatch CRM</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>Bajwa CRM</h2>
        </div>

        <ul>
            <li><a href="#"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="#"><i class="fa-solid fa-address-book"></i> Contacts</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> Drivers</a></li>
            <li><a href="#"><i class="fa-solid fa-truck"></i> Trucks</a></li>
            <li><a href="#"><i class="fa-solid fa-box"></i> Loads</a></li>
            <li><a href="#"><i class="fa-solid fa-handshake"></i> Brokers</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> Customers</a></li>
            <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>

    </aside>

    <!-- Main -->
    <main class="main-content">

        <header>
            <h1>Dashboard</h1>
        </header>

        <section class="cards">

            <div class="card">
                <h3>Total Contacts</h3>
                <h2>0</h2>
            </div>

            <div class="card">
                <h3>Total Drivers</h3>
                <h2>0</h2>
            </div>

            <div class="card">
                <h3>Total Loads</h3>
                <h2>0</h2>
            </div>

            <div class="card">
                <h3>Total Brokers</h3>
                <h2>0</h2>
            </div>

        </section>

    </main>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
